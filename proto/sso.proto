syntax = "proto3";

package sso;

service UserService {
  rpc GetUser (UserRequest) returns (UserResponse);
  rpc GetUsers (Empty) returns (UsersResponse);
}

message Empty {}

message UserRequest {
  int32 id = 1;
  string name = 2;
  string email = 3;

}

message UserResponse {
  int32 id = 1;
  string name = 2;
}

message UsersResponse {
  repeated UserResponse users = 1;
}