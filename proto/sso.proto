syntax = "proto3";

package sso;

service UserService {
  rpc GetUser (UserRequest) returns (UserResponse);
  rpc GetUsers (Empty) returns (UsersResponse);
}

message Empty {}

message UserRequest {
  int32 id = 1;
}

message UserResponse {
  int32 id = 1;
  string full_name = 2;
  string email = 3;
  string username = 4;
}

message UsersResponse {
  repeated UserResponse users = 1;
}